<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Pure Intonation Workbench</title>
    <link rel="stylesheet" href="/static/style.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <p class="eyebrow">RATIONAL TUNING LAB</p>
        <h1>Pure Intonation Workbench</h1>
      </div>
      <a href="/docs" target="_blank" rel="noreferrer">API docs ↗</a>
    </header>

    <main>
      <section class="panel controls">
        <div class="section-heading"><h2>Generator</h2><span id="status" role="status">Ready</span></div>
        <label>生成方法
          <select id="generator">
            <option value="cps">Combination Product Set</option>
            <option value="euler">Euler–Fokker genus</option>
            <option value="harmonic">Harmonic series</option>
            <option value="subharmonic">Subharmonic series</option>
          </select>
        </label>
        <label id="factor-field">因子（カンマ区切り）
          <input id="factors" value="1, 3, 5, 7" inputmode="numeric">
        </label>
        <label id="choose-field">組合せの数 <span id="choose-value">2</span>
          <input id="choose" type="range" min="1" max="4" value="2">
        </label>
        <label id="count-field" hidden>倍音数
          <input id="count" type="number" min="1" max="128" value="16">
        </label>
        <label class="check"><input id="octave" type="checkbox" checked> 1オクターブ内に正規化</label>
        <button id="generate" class="primary">音階を生成</button>
      </section>

      <section class="panel visualizer">
        <div class="section-heading"><h2 id="visual-title">Pitch circle</h2><span id="scale-name">CPS(4,2)</span><button id="graph-toggle" class="quiet" title="Graph view">Graph</button></div>
        <div id="walk-controls" class="walk-controls" hidden>
          <select id="graph-layout" title="レイアウト">
            <option value="force">force-directed</option>
            <option value="layered">layered grid</option>
          </select>
          <select id="grid-sort" title="レイヤー内の並び順" hidden>
            <option value="lexicographic">lexicographic</option>
            <option value="product">product</option>
            <option value="pitch">pitch</option>
          </select>
          <select id="ratio-mode" title="ラベル">
            <option value="harmonic">harmonic</option>
            <option value="subharmonic">subharmonic</option>
          </select>
          <select id="walk-operation">
            <option value="random_walk">random walk</option>
            <option value="weighted_walk">weighted walk</option>
            <option value="shortest_path">shortest path</option>
          </select>
          <input id="walk-steps" type="number" min="1" max="200" value="12" title="ステップ数">
          <input id="walk-seed" type="number" value="42" title="シード">
          <input id="walk-end" type="number" min="1" value="6" title="終点ノード (shortest path)" hidden>
          <select id="walk-metric" hidden>
            <option value="harmonic">harmonic</option>
            <option value="monzo">monzo</option>
            <option value="cent">cent</option>
          </select>
          <button id="walk-run" class="quiet">Walk</button>
        </div>
        <p id="grid-hint" class="hint" hidden>ダブルクリックで基準ノードを変更。</p>
        <canvas id="circle" width="720" height="720" aria-label="音程の円周表示"></canvas>
        <p class="hint">点をクリックして発音。PCキーボードは <kbd>A</kbd> から順に使えます。</p>
        <div class="legend" aria-label="調和度の凡例"><span class="selected">発音中</span><span class="strong">強い調和</span><span class="close">近い調和</span><span class="distant">遠い関係</span></div>
      </section>

      <aside class="panel sound">
        <div class="section-heading"><h2>Sound</h2><button id="stop" class="quiet">Stop all</button></div>
        <label>基音 <output id="base-output">220 Hz</output>
          <input id="base-frequency" type="range" min="110" max="440" value="220">
        </label>
        <label>波形
          <select id="waveform">
            <option value="sine">Sine</option>
            <option value="triangle">Triangle</option>
            <option value="sawtooth">Sawtooth</option>
            <option value="square">Square</option>
          </select>
        </label>
        <label>Attack <output id="attack-output">20 ms</output><input id="attack" type="range" min="5" max="500" value="20"></label>
        <label>Decay <output id="decay-output">140 ms</output><input id="decay" type="range" min="10" max="1000" value="140"></label>
        <label>Sustain <output id="sustain-output">65%</output><input id="sustain" type="range" min="5" max="100" value="65"></label>
        <label>Release <output id="release-output">280 ms</output><input id="release" type="range" min="20" max="1500" value="280"></label>
        <div class="keyboard" id="keyboard" aria-label="演奏キーボード"></div>
      </aside>

      <section class="panel pitches">
        <div class="section-heading"><h2>Intervals</h2><button id="scala" class="quiet">Scala を保存</button></div>
        <div class="table-wrap"><table><thead><tr><th>Key</th><th>Ratio</th><th>Cents</th><th>Monzo</th><th></th></tr></thead><tbody id="pitches"></tbody></table></div>
      </section>
      <section class="panel timeline">
        <div class="section-heading"><h2>Timeline</h2><span id="timeline-length"></span><span class="button-row"><button id="timeline-play" class="quiet" title="Replay recording">▶</button><button id="timeline-clear" class="quiet" title="Clear recording">Clear</button><button id="record" class="quiet" title="Record performance">Record</button></span></div>
        <div id="timeline-events" class="timeline-events" aria-live="polite"></div>
      </section>

      <section class="panel compose">
        <div class="section-heading"><h2>Compose</h2><span id="compose-status" role="status"></span></div>
        <div class="compose-grid">
          <div>
            <label>因子（カンマ区切り）
              <input id="harmony-factors" value="1, 3, 5, 7" inputmode="numeric">
            </label>
            <label>組合せの数 <output id="harmony-choose-value">2</output>
              <input id="harmony-choose" type="range" min="1" max="4" value="2">
            </label>
            <label>長さ
              <input id="harmony-length" type="number" min="1" max="64" value="8">
            </label>
            <label>シード
              <input id="harmony-seed" type="number" value="42">
            </label>
            <label>距離メトリクス
              <select id="harmony-metric">
                <option value="harmonic">harmonic</option>
                <option value="monzo">monzo</option>
                <option value="cent">cent</option>
              </select>
            </label>
            <button id="compose-generate" class="primary">和声進行を生成</button>
          </div>
          <div>
            <label>ベース戦略
              <select id="bass-strategy">
                <option value="hybrid">hybrid</option>
                <option value="mirror">mirror</option>
                <option value="root">root</option>
                <option value="fifth">fifth</option>
              </select>
            </label>
            <label>旋律の声部数
              <input id="melody-voices" type="number" min="1" max="4" value="1">
            </label>
            <label>旋律の輪郭
              <select id="melody-contour">
                <option value="arch">arch</option>
                <option value="ascending">ascending</option>
                <option value="descending">descending</option>
                <option value="free">free</option>
              </select>
            </label>
            <div class="button-row">
              <button id="bass-generate">ベース生成</button>
              <button id="melody-generate">旋律生成</button>
            </div>
          </div>
          <div>
            <label>テンポ (BPM)
              <input id="tempo" type="number" min="40" max="240" value="96">
            </label>
            <div class="button-row">
              <button id="progression-play">▶ 再生</button>
              <button id="progression-stop" class="quiet">停止</button>
            </div>
            <div class="button-row">
              <button id="export-midi">MIDI</button>
              <button id="export-json">JSON</button>
              <button id="render-wav">WAV レンダリング</button>
            </div>
            <p id="render-status" class="hint"></p>
            <audio id="render-player" controls hidden></audio>
          </div>
        </div>
        <div id="progression" class="progression" aria-live="polite"></div>
      </section>

      <section class="panel rhythm">
        <div class="section-heading"><h2>Rhythm</h2><span id="rhythm-status" role="status"></span></div>
        <div class="compose-grid">
          <div>
            <label>ステップ数
              <input id="rhythm-steps" type="number" min="1" max="32" value="13">
            </label>
            <label>パルス数
              <input id="rhythm-pulses" type="number" min="0" max="32" value="5">
            </label>
            <label>回転
              <input id="rhythm-rotation" type="number" min="0" max="31" value="2">
            </label>
            <button id="rhythm-generate" class="primary">Euclidean リズムを生成</button>
          </div>
          <div>
            <label>シード
              <input id="humanize-seed" type="number" value="42">
            </label>
            <label>タイミング揺らぎ (ms)
              <input id="humanize-timing" type="number" min="0" max="100" value="12">
            </label>
            <div class="button-row">
              <button id="humanize-run">ヒューマナイズ</button>
              <button id="rhythm-play">▶ 再生</button>
              <button id="rhythm-stop" class="quiet">停止</button>
            </div>
            <label>ドラム音 (GM ノート番号)
              <input id="rhythm-note" type="number" min="0" max="127" value="36">
            </label>
            <div class="button-row">
              <button id="rhythm-export-midi">MIDI</button>
              <button id="rhythm-export-json">JSON</button>
            </div>
          </div>
        </div>
        <div id="rhythm-grid" class="rhythm-grid" aria-live="polite"></div>
      </section>
    </main>
    <template id="key-template"><button class="key"><span class="key-name"></span><span class="ratio"></span></button></template>
    <script src="/static/app.js"></script>
  </body>
</html>
