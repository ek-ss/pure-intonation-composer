<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Vital Pack Composer | Pure Intonation Workbench</title><link rel="stylesheet" href="/static/style.css?v=20260728-vital-pack-1"></head>
<body class="vital-pack-page"><header class="topbar"><div><p class="eyebrow">PURE INTONATION VITAL PACK · 7-LIMIT ARRANGEMENT</p><h1>Vital Pack Composer</h1><p class="page-subtitle">Role-aware Vital arrangement, dynamic tuning policies, and DAW-ready metadata</p></div><span class="topbar-links"><a href="/">Workbench</a><a href="/minimal-functional-composer">Minimal Composer</a><a href="/prime-limit-explorer">Prime Explorer</a></span></header>
<main class="vital-pack-main"><section class="panel vital-controls"><div class="section-heading"><h2>Song Plan</h2><span id="vital-status" role="status">Ready</span></div><label>Bars<input id="vital-bars" type="number" min="8" max="64" value="64"></label><label>Tempo<input id="vital-tempo" type="number" min="130" max="175" value="150"></label><label>Seed<input id="vital-seed" type="number" value="72801"></label><label>Tuning<select id="vital-tuning"><option value="7-limit">7-limit JI</option><option value="5-limit">5-limit JI</option></select></label><label>Preset mode<select id="vital-mode"><option value="adaptive">Adaptive 4–7 voices</option><option value="showcase">Showcase all 8</option></select></label><button id="vital-generate" class="primary">Generate song plan</button><div class="button-row"><button id="vital-play">Play excerpt</button><button id="vital-stop" class="quiet">Stop</button></div><div class="button-row"><button id="vital-json" class="quiet">Project JSON</button><button id="vital-reaper" class="quiet">REAPER manifest</button></div></section>
<section class="panel vital-form-panel"><div class="section-heading"><h2>Form and Energy</h2><span id="vital-summary"></span></div><svg id="vital-form" viewBox="0 0 1120 220" role="img" aria-label="Vital Pack form and energy"></svg></section>
<section class="panel vital-tracks-panel"><div class="section-heading"><h2>Vital Instruments</h2><span id="vital-profile-summary"></span></div><div id="vital-tracks" class="vital-tracks"></div></section>
<section class="panel vital-tuning-panel"><div class="section-heading"><h2>Dynamic Tuning and Automation</h2><span id="vital-tuning-summary"></span></div><div id="vital-policies" class="vital-policies"></div><svg id="vital-automation" viewBox="0 0 1120 170" role="img" aria-label="Vital Pack automation curves"></svg></section></main><script src="/static/vital_pack_composer.js?v=20260728-vital-pack-1"></script></body></html>
